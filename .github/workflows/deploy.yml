name: Deploy to FC

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package code.zip
        run: npm run package

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: Configure credentials
        run: s config add --AccessKeyID ${{ secrets.ALIYUN_ACCESS_KEY_ID }} --AccessKeySecret ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }} -a default -f

      - name: Deploy to FC
        env:
          DB_HOST: pgm-wz926p594292r913.rwlb.rds.aliyuncs.com
          DB_NAME: appliance_db
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: "5432"
          DB_USER: rwrwrw2224
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          MIGRATE_SECRET: ${{ secrets.MIGRATE_SECRET }}
          CDN_DOMAIN: ${{ secrets.CDN_DOMAIN }}
        run: s deploy -y --use-local

      - name: Run database migration
        run: |
          # 等 FC 部署生效
          sleep 10
          # 调迁移接口（走 FC 公网 -> VPC 内网连 DB）
          RESPONSE=$(curl -s -X POST "https://appliance-api.cheapgo.top/api/admin/db/migrate" \
            -H "X-Migrate-Secret: ${{ secrets.MIGRATE_SECRET }}" \
            -H "Content-Type: application/json")
          echo "迁移响应: $RESPONSE"
          # 检查是否成功（code=0）
          CODE=$(echo "$RESPONSE" | jq -r '.code // 1')
          if [ "$CODE" != "0" ]; then
            echo "❌ 数据库迁移失败，部署标记为失败"
            exit 1
          fi
          echo "✅ 数据库迁移完成"

      - name: Install Aliyun CLI
        run: |
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz | tar xz
          sudo mv aliyun /usr/local/bin/

      - name: Configure VPC for FC
        run: |
          aliyun configure set --mode AK --region cn-shenzhen --access-key-id ${{ secrets.ALIYUN_ACCESS_KEY_ID }} --access-key-secret ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          aliyun fc UpdateFunction --functionName api --body '{"functionName":"api","vpcConfig":{"vpcId":"vpc-wz9panhs3lr4y30c8cd75","vswitchIds":["vsw-wz9x49y8clwt46f3086x7"],"securityGroupId":"sg-wz95y2xh9e7ajlongxaj"}}' --region cn-shenzhen
